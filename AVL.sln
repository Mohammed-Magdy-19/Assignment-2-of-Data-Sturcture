                cout << endl;
                cout << "Error: Book ID not found!\n";
            }
            else {
                root = Delete(root, id);
                cout << endl;
                cout << "Book deleted successfully.\n";
            }
        }

        
        // SEARCH
        else if (choice == 3) {

            int id;

            cout << "Enter ID to search: ";
            cin >> id;

            Node* result = Search(root, id);

            if (result != NULL) {

                cout << endl;
                cout << "\nBook is Found:\n";

                cout << "ID: "
                    << result->id
                    << endl;

                cout << "Title: "
                    << result->title
                    << endl;
            }

            else {
                
                cout << endl;
                cout << "Book not exist.\n";
            }
        }

        
        // DISPLAY
        else if (choice == 4) {
            
            if (root == NULL) {
                
                cout << endl;
                cout << "No books available.\n";
            }

            else {
                printed = false;
                inorder(root);
                printLine();

                // reset for next display
                
            }
        
        }

        
        // CLOSEST ID
        else if (choice == 5) {

            int target;

            cout << "Enter target ID: ";
            cin >> target;

            if (root == NULL) {

                cout << endl;
                cout << "Tree is empty.No closest ID.\n";
            }

            else {

                int closest =
                    findClosest(root, target);

                cout << "Closest ID = "
                    << closest
                    << endl;
            }
        }
        else if (choice == 6) {
            cout << "\nBooks in Tree:\n";

            printPrettyTree(root);
        }

    } while (choice != 7);

    return 0;
}
