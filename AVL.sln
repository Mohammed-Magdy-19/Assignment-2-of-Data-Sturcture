#include <iostream>
#include<string>
#include <algorithm>
#include <cmath>
#include <queue>
#include <iomanip>
#include<vector>
bool printed = false;
using namespace std;
class Node {
    public :
    int id;
    string title;
    Node*right, *left;
    int height;
    Node(int ID, string t) {
        this->id= ID;
        this->title=t;
        right=NULL;
        left=NULL;
        height=1;
    }
    };
    // TO GET HEIGHT 
    int get_height(Node*n) {
    if (n==0) return 0;
    return n->height;
    }
    // TO GET Balance Factor 
    int BalanceFactor(Node* n) {
        if (n==0) return 0;
        return get_height(n->left)-get_height(n->right);

    }
    // Right ROTATION -> LL
    Node* rightRotate(Node* n) {
    Node*x =n->left;
    Node* temp= x->right;

    x->right=n;
    n->left=temp;

    n->height= max(get_height(n->left), get_height(n->right))+1;
    x->height= max(get_height(x->left), get_height(x->right)) + 1;

    // new root 
    return x;
    }

    // Left ROTATION -> RR

    Node* leftRotate(Node* n) {
    Node* x=n->right;
    Node* temp= x->left;

    x->left = n;
    n->right=temp;

    n->height= max(get_height(n->left), get_height(n->right)) + 1;
    x->height = max(get_height(x->left), get_height(x->right)) + 1;

    return x;
    }

    // Function Insert
    Node* insert(Node* n, int id, string title) {
        if(n==NULL) return new Node(id , title);
        if (id < n->id) {
           n->left= insert(n->left,id , title);

        }
        else if (id > n->id) {
            n->right= insert(n->right, id , title);
        }
        // not duplicte ids
        else {
            cout << "Book ID already exists.\n";
            return n;
        }
        n->height =
            1 + max(get_height(n->left),
                get_height(n->right));

        int balance = BalanceFactor(n);

        // LL Case
        if (balance > 1 && (id < n->left->id)) {
            return rightRotate(n);
        }

        // RR Case
        if (balance < -1 && (id > n->right->id)) {
            return leftRotate(n);
        }

        // LR Case
        if (balance > 1 && (id > n->left->id)) {
        n->left= leftRotate(n->left);
        return rightRotate(n);
        }

        // RL Case 
        if (balance < -1 && (id < n->right->id)) {
        n->right= rightRotate(n->right);
        return leftRotate(n);
        }

        return n;
    }

    // to found Successor.
    Node* MinNode(Node* n) {
        Node* temp =n;
        while (temp->left != NULL) {
            temp=temp->left;
        }
        return temp;
    }

    // Function Delete

    Node* Delete(Node*n, int id) {
    if (n==NULL) return n;

    if (id < n->id) {
        n->left= Delete(n->left , id);
    }
    else if (id > n->id) {
        n->right= Delete(n->right , id);
    }
    // found id
    else {
        // there is 3 cases for Delete 
        // CASE 1 ->have no child.
        if (n->left == NULL && n->right == NULL) {
            delete n;
            return NULL;
        }
        // CASE 2 ->have one Child.
        if (n->left == NULL) {
            Node *temp= n->right;
            delete n;
            return temp;
        }
        else if (n->right == NULL) {
            Node* temp = n->left;
            delete n;
            return temp;
        }
        // CASE 3 ->have two Child (use successor)
        else {
            Node *temp= MinNode(n->right);
            n->id=temp->id;
            n->title= temp->title;
            n->right= Delete(n->right,temp->id);
        }
      
    }
    if (n==NULL)
    return n;

    n->height= 1 + max(get_height(n->left),
        get_height(n->right));

    int balance = BalanceFactor(n);

    // Check Balance
    // LL
    if (balance > 1 && BalanceFactor(n->left) >= 0) {
    return rightRotate(n);

    }

    // RR 

    if (balance < -1 && BalanceFactor(n->right) <= 0) {
        return leftRotate(n);
    }

    // LR

    if (balance > 1 && BalanceFactor(n->left) < 0) {
        n->left= leftRotate(n->left);
        return rightRotate(n);
    }

    // RL 

    if (balance < -1 && BalanceFactor(n->right)>0) {
        n->right= rightRotate(n->right);
        return leftRotate(n);
    }

    return n;
    }

    Node* Search(Node* n, int id) {
        if (n==NULL) return NULL;

        if (n->id== id)return n;
        if (id < n->id) {
            return Search(n->left, id);
        }
        else{
            return Search(n->right, id);
        }
    }

    /*void inorder(Node* n) {
        if (n==NULL) return ;

        inorder(n->left);
        cout << "ID: "
            << n->id
            << " | Title: "
            << n->title
            << endl;

        inorder(n->right);

    }*/
    int getMax(Node* n) {
        if (!n) return 0;

        int lenId = to_string(n->id).size();
        int lenTitle = n->title.size();

        return max({ lenId, lenTitle, getMax(n->left), getMax(n->right) });
    }

    int idW, titleW;

    void buildWidth(Node* n) {
        int maxLen = getMax(n);
        idW = max(4, maxLen);
        titleW = max(10, maxLen + 5);
    }

    void printLine() {
        cout << "+";
        for (int i = 0; i < idW + 2; i++) cout << "-";
        cout << "+";
        for (int i = 0; i < titleW + 2; i++) cout << "-";
        cout << "+\n";
    }

    void printRow(string id, string title) {
        cout << "| " << left << setw(idW) << id
            << " | " << left << setw(titleW) << title << " |\n";
    }
    void inorder(Node* n) {
        if (!n) return;

        if (!printed) {
            buildWidth(n);

            printLine();
            printRow("ID", "Title");
            printLine();

            printed = true;
        }

        inorder(n->left);
        printRow(to_string(n->id), n->title);
        inorder(n->right);
    }

   int findClosest(Node* n, int terget) {
        int closest = n->id;
        while (n != NULL) {
            if(abs(n->id - terget)< abs(closest -terget)) closest = n->id;

            if (terget < n->id) {
                n= n->left ;
            }
            else if (terget > n->id) {
                n= n->right;
            }
            else {
                return n->id;
            }
        }
        return closest;
    }
   void printSpaces(int n) {

       for (int i = 0; i < n; i++)
           cout << " ";
   }

   void printPrettyTree(Node* root) {

       if (root == NULL) {
           cout << "Tree is empty.\n";
           return;
       }

       queue<Node*> q;
       q.push(root);

       int height = get_height(root);

       int level = 0;

       while (level < height) {

           int nodes = pow(2, level);

           int firstSpaces = pow(2, height - level) - 1;
           int betweenSpaces = pow(2, height - level + 1) - 1;

           printSpaces(firstSpaces);

           vector<Node*> currentLevel;

           for (int i = 0; i < nodes; i++) {

               Node* node = q.front();
               if (q.empty()) break;
               q.pop();

               currentLevel.push_back(node);

               if (node != NULL) {

                   cout << node->id;
                   q.push(node->left);
                   q.push(node->right);
               }
               else {
                   cout << " ";
                   q.push(NULL);
                   q.push(NULL);
               }

               printSpaces(betweenSpaces);
           }

           cout << "\n";

           //////////////////////////////////////////////////
           // branches  / \
           //////////////////////////////////////////////////

           if (level != height - 1) {

               printSpaces(firstSpaces - 1);

               for (Node* node : currentLevel) {

                   if (node != NULL && node->left != NULL)
                       cout << "/";

                   else
                       cout << " ";

                   printSpaces(1);

                   if (node != NULL && node->right != NULL)
                       cout << "\\";

                   else
                       cout << " ";

                   printSpaces(betweenSpaces - 1);
               }

               cout << "\n";
           }

           level++;
       }
   }
    


int main()
{
    Node* root = NULL;

    int choice;

    do {

        cout << "\n=====================================\n";
        cout << "        AVL BOOK SYSTEM MENU         \n";
        cout << "=====================================\n";

        cout << "  [1] Insert Book\n";
